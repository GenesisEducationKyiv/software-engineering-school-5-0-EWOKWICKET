syntax = "proto3";

package notifications;

message Notification {
  string to = 1;
  string subject = 2;
}

message ConfirmationNotification {
  string to = 1;
  string subject = 2;
  string token = 3;
}

message WeatherUpdateDto {
  string city = 1;
  double temperature = 2;
  double humidity = 3;
  string description = 4;
}

message WeatherUpdateNotification {
  string to = 1;
  string subject = 2;
  WeatherUpdateDto data = 3;
}

message ConfirmationNotificationOptions {
  ConfirmationNotification data = 1;
  string type = 2;
}

message WeatherUpdateNotificationOptions {
  WeatherUpdateNotification data = 1;
  string type = 2;
}

message Empty {} // for void return

service NotificationsService {
  rpc sendConfirmationNotification (ConfirmationNotificationOptions) returns (Empty);
  rpc sendWeatherUpdateNotification (WeatherUpdateNotificationOptions) returns (Empty);
}