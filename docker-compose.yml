services:
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  subscription_mongo:
    container_name: subscription_mongo
    image: mongo
    restart: always
    ports:
      - 27017:27017
    volumes:
      - subscription_mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmqctl', 'status']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:2.9.7
    container_name: loki
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./packages/api/libs/logger/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki

  weather:
    container_name: weather
    build:
      context: ./packages/api
      dockerfile: apps/weather/Dockerfile
    env_file: ./packages/api/apps/weather/.env
    environment:
      REDIS_URL: redis://redis:6379
      G_URL: http://loki:3100
    ports:
      - 50053:50053
    depends_on:
      redis:
        condition: service_started
      loki:
        condition: service_started

  notifications:
    container_name: notifications
    build:
      context: ./packages/api
      dockerfile: apps/notifications/Dockerfile
    env_file: ./packages/api/apps/notifications/.env
    environment:
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      G_URL: http://loki:3100
    depends_on:
      rabbitmq:
        condition: service_healthy

  subscription:
    container_name: subscription
    build:
      context: ./packages/api
      dockerfile: apps/subscription/Dockerfile
    env_file: ./packages/api/apps/subscription/.env
    environment:
      WEATHER_URL: weather:50053
      DB_URI: mongodb://subscription_mongo:27017/weatherAPI
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
      G_URL: http://loki:3100
    ports:
      - 50052:50052
    depends_on:
      subscription_mongo:
        condition: service_started
      notifications:
        condition: service_started
      weather:
        condition: service_started

  gateway:
    container_name: gateway
    build:
      context: ./packages/api
      dockerfile: apps/gateway/Dockerfile
    env_file: ./packages/api/apps/gateway/.env
    environment:
      SUBSCRIPTION_URL: subscription:50052
      WEATHER_URL: weather:50053
    ports:
      - 3000:3000
    depends_on:
      subscription:
        condition: service_started

volumes:
  subscription_mongo-data:
  redis-data:
  loki-data:
