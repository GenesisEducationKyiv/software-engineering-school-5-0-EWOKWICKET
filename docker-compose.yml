  weather:
    container_name: weather
    build:
      context: ./packages/api
      dockerfile: apps/weather/Dockerfile
    env_file: ./packages/api/apps/weather/.env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - 50053:50053
    depends_on:
      - redis

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

volumes:
  subscription_mongo-data:
  redis-data:
