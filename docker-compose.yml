services:
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

  subscription_mongo:
    container_name: subscription_mongo
    image: mongo
    restart: always
    ports:
      - 27017:27017
    volumes:
      - subscription_mongo-data:/data/db

  weather:
    container_name: weather
    build:
      context: ./packages/api
      dockerfile: apps/weather/Dockerfile
    env_file: ./packages/api/apps/weather/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - 50053:50053
    depends_on:
      redis:
        condition: service_started

  notifications:
    container_name: notifications
    build:
      context: ./packages/api
      dockerfile: apps/notifications/Dockerfile
    env_file: ./packages/api/apps/notifications/.env
    ports:
      - 50051:50051

  subscription:
    container_name: subscription
    build:
      context: ./packages/api
      dockerfile: apps/subscription/Dockerfile
    env_file: ./packages/api/apps/subscription/.env
    environment:
      WEATHER_URL: weather:50053
      NOTIFICATIONS_URL: notifications:50051
      DB_URI: mongodb://subscription_mongo:27017/weatherAPI
    ports:
      - 50052:50052
    depends_on:
      subscription_mongo:
        condition: service_started
      notifications:
        condition: service_started
      weather:
        condition: service_started

  gateway:
    container_name: gateway
    build:
      context: ./packages/api
      dockerfile: apps/gateway/Dockerfile
    env_file: ./packages/api/apps/gateway/.env
    environment:
      SUBSCRIPTION_URL: subscription:50052
      WEATHER_URL: weather:50053
    ports:
      - 3000:3000
    depends_on:
      subscription:
        condition: service_started

volumes:
  subscription_mongo-data:
  redis-data:
