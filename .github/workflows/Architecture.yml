name: Architecture tests CI pipeline

permissions:
  contents: read

on: [push, workflow_dispatch]

jobs:
  architecture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run architecture tests in docker
        run: yarn docker:architecture
        working-directory: packages/api

      - name: Clear containers
        if: always()
        run: yarn docker:test:clear
        working-directory: packages/api
